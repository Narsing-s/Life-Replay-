<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090d"><meta name="description" content="Life Replay turns your memories into beautiful stories.">
<title>Life Replay — Your life, beautifully remembered</title>
<link rel="stylesheet" href="./style.css?v=7">
</head>
<body><div id="app"></div>
<script>
(function(){'use strict';
var KEY='life-replay.safe.v2';
var seed=[
{id:1,date:'2026-01-01',title:'A new beginning',caption:'New year, new energy.',place:'Home',src:'https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=1400&q=88'},
{id:2,date:'2026-02-14',title:'Small moments',caption:'The moments worth keeping.',place:'City',src:'https://images.unsplash.com/photo-1511988617509-a57c8a288659?auto=format&fit=crop&w=1400&q=88'},
{id:3,date:'2026-03-21',title:'Out there',caption:'A day that felt different.',place:'Travel',src:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1400&q=88'}
];
var memories=seed.slice(),mode='home',query='',place='all';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x)&&x.length)memories=x}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(memories))}catch(e){}}
function stats(){var p={},y={};memories.forEach(function(m){p[m.place]=1;y[String(m.date).slice(0,4)]=1});return{places:Object.keys(p).length,years:Object.keys(y).length}}
function filtered(){var q=query.toLowerCase();return memories.filter(function(m){return(!q||(m.title+' '+m.caption+' '+m.place).toLowerCase().indexOf(q)>=0)&&(place==='all'||m.place===place)})}
function header(){return '<header class="top"><button class="logo" id="home"><span>✦</span> LIFE REPLAY</button><nav><button class="navActive" id="timelineNav">Timeline</button><button id="replayNav">Replay</button><button id="connectNav">Google Photos</button></nav><div class="topRight"><button class="iconBtn" id="export" aria-label="Export">↓</button><button class="avatar" id="profile">LR</button></div></header>'}
function home(){var list=filtered(),s=stats(),places=[],groups={};memories.forEach(function(m){if(places.indexOf(m.place)<0)places.push(m.place)});list.forEach(function(m){var y=String(m.date).slice(0,4);(groups[y]||(groups[y]=[])).push(m)});places.sort();var years=Object.keys(groups).sort().reverse(),timeline='';years.forEach(function(y){timeline+='<div class="yearBlock"><div class="yearTitle">'+esc(y)+'</div><div class="rail">';groups[y].sort(function(a,b){return a.date.localeCompare(b.date)}).forEach(function(m){var d=new Date(m.date+'T00:00:00');timeline+='<article class="memory" data-id="'+esc(m.id)+'"><div class="memoryDate">'+d.toLocaleString(undefined,{month:'short'}).toUpperCase()+' '+d.getDate()+'</div><div class="memoryCard"><div class="imageWrap"><img src="'+esc(m.src)+'" alt="'+esc(m.title)+'"><span class="heart">♡</span></div><div class="memoryBody"><div class="tiny">'+esc(m.place)+' · '+esc(m.date.slice(0,4))+'</div><h3>'+esc(m.title)+'</h3><p>'+esc(m.caption)+'</p><span class="view">View memory →</span></div></div></article>'});timeline+='</div></div>'});
var hero=memories.slice().sort(function(a,b){return b.date.localeCompare(a.date)})[0];
document.getElementById('app').innerHTML=header()+'<main><section class="hero"><div class="heroCopy"><div class="eyebrow">✦ YOUR PERSONAL MEMORY SPACE</div><h1>Your life,<br><em>beautifully remembered.</em></h1><p>One private place for the moments that made you who you are — ready to become stories.</p><div class="heroActions"><button class="primary" id="add">＋ Add memories</button><button class="outline" id="connect">◎ Connect Google Photos</button></div><div class="trust">Private by design · Your memories stay in your browser</div></div><div class="heroVisual"><img src="'+esc(hero.src)+'" alt="Latest memory"><div class="floating"><span>✦ LATEST MEMORY</span><b>'+esc(hero.title)+'</b><small>'+esc(hero.date)+' · '+esc(hero.place)+'</small></div></div><input id="files" hidden type="file" accept="image/*" multiple></section><section class="journey"><div><span class="eyebrow">YOUR JOURNEY</span><h2>'+memories.length+' moments. Infinite stories.</h2></div><div class="stats"><div><b>'+memories.length+'</b><span>memories</span></div><div><b>'+s.places+'</b><span>places</span></div><div><b>'+s.years+'</b><span>years</span></div></div></section><section class="quick"><button class="quickCard" id="replay"><span>▶</span><div><b>Replay your life</b><small>Turn your timeline into a story</small></div><strong>→</strong></button><button class="quickCard" id="connect2"><span>◎</span><div><b>Bring your photos</b><small>Choose memories from Google Photos</small></div><strong>→</strong></button><button class="quickCard" id="add2"><span>＋</span><div><b>Create a memory</b><small>Add photos from your device</small></div><strong>→</strong></button></section><section class="timelineSection"><div class="sectionHead"><div><span class="eyebrow">MEMORY TIMELINE</span><h2>Moments that matter</h2></div><div class="filters"><input id="search" placeholder="Search memories…" value="'+esc(query)+'"><select id="place"><option value="all">All places</option>'+places.map(function(p){return '<option value="'+esc(p)+'"'+(p===place?' selected':'')+'>'+esc(p)+'</option>'}).join('')+'</select></div></div><div class="timeline">'+(timeline||'<div class="empty">No memories match your search.</div>')+'</div></section><section class="finalCta"><div><span class="eyebrow">✦ YOUR STORY IS STILL BEING WRITTEN</span><h2>Make room for<br><em>what comes next.</em></h2></div><button class="primary" id="add3">＋ Add a memory</button></section></main>';
['add','add2','add3'].forEach(function(id){document.getElementById(id).onclick=function(){document.getElementById('files').click()}});document.getElementById('files').onchange=files;document.getElementById('replay').onclick=function(){mode='story';render()};document.getElementById('replayNav').onclick=function(){mode='story';render()};document.getElementById('connect').onclick=google;document.getElementById('connect2').onclick=google;document.getElementById('connectNav').onclick=google;document.getElementById('home').onclick=function(){mode='home';query='';place='all';render()};document.getElementById('export').onclick=exportData;document.getElementById('profile').onclick=function(){toast('Life Replay is currently local-first ✦')};document.getElementById('search').oninput=function(e){query=e.target.value;home()};document.getElementById('place').onchange=function(e){place=e.target.value;home()};document.querySelectorAll('.memory').forEach(function(el){el.onclick=function(){openMemory(el.dataset.id)}})}
function story(){var s=stats();document.getElementById('app').innerHTML='<div class="storyPage"><button class="back" id="back">← Timeline</button><div class="storyHero"><span class="eyebrow">✦ YOUR REPLAY</span><h1>The moments<br><em>that made the year.</em></h1><p>'+memories.length+' memories · '+s.places+' places · '+s.years+' years</p><button class="primary" id="storyShare">↗ Share replay</button></div><div class="storyGrid">'+memories.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).map(function(m){return '<article class="storyItem"><img src="'+esc(m.src)+'"><div><small>'+esc(m.date)+' · '+esc(m.place)+'</small><h3>'+esc(m.title)+'</h3><p>'+esc(m.caption)+'</p></div></article>'}).join('')+'</div><footer>life replay · your memories, your story.</footer></div>';document.getElementById('back').onclick=function(){mode='home';render()};document.getElementById('storyShare').onclick=share}
function google(){document.body.insertAdjacentHTML('beforeend','<div class="modal" id="googleModal"><div class="connectBox"><button class="close" id="gClose">×</button><div class="googleLogo">G</div><span class="eyebrow">GOOGLE PHOTOS</span><h2>Bring your memories with you.</h2><p>Life Replay is ready for a secure Google Photos connection. We will only request the access needed to select memories — never your password.</p><div class="connectSteps"><div><b>01</b><span>Connect your Google account</span></div><div><b>02</b><span>Choose photos or albums</span></div><div><b>03</b><span>Turn them into Life Replay stories</span></div></div><button class="primary full" id="googleStart">Connect Google Photos</button><small class="privacy">Google OAuth setup is required before live account access is enabled.</small></div></div>');document.getElementById('gClose').onclick=closeGoogle;document.getElementById('googleModal').onclick=function(e){if(e.target.id==='googleModal')closeGoogle()};document.getElementById('googleStart').onclick=function(){toast('Google Photos connection is ready for OAuth configuration ✦');closeGoogle()}}
function closeGoogle(){var x=document.getElementById('googleModal');if(x)x.remove()}
function files(e){Array.prototype.forEach.call(e.target.files||[],function(f,i){if(String(f.type).indexOf('image/')!==0)return;var r=new FileReader();r.onload=function(){memories.unshift({id:Date.now()+i,date:new Date(f.lastModified||Date.now()).toISOString().slice(0,10),title:f.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' '),caption:'Captured and kept.',place:'My memories',src:r.result});save();render();toast('Memory added ✦')};r.readAsDataURL(f)});e.target.value=''}
function openMemory(id){var m=memories.filter(function(x){return String(x.id)===String(id)})[0];if(!m)return;document.getElementById('app').insertAdjacentHTML('beforeend','<div class="modal" id="memoryModal"><div class="memoryModal"><button class="close" id="close">×</button><img src="'+esc(m.src)+'"><div class="modalContent"><small>'+esc(m.date)+' · '+esc(m.place)+'</small><h2>'+esc(m.title)+'</h2><p>'+esc(m.caption)+'</p><button class="danger" id="remove">Remove memory</button></div></div></div>');document.getElementById('close').onclick=closeMemory;document.getElementById('memoryModal').onclick=function(e){if(e.target.id==='memoryModal')closeMemory()};document.getElementById('remove').onclick=function(){memories=memories.filter(function(x){return String(x.id)!==String(id)});save();closeMemory();render()}}
function closeMemory(){var x=document.getElementById('memoryModal');if(x)x.remove()}
function share(){var data=btoa(unescape(encodeURIComponent(JSON.stringify(memories.map(function(m){return{id:m.id,date:m.date,title:m.title,caption:m.caption,place:m.place}})))));var url=location.href.split('#')[0]+'#replay='+data;if(navigator.share)navigator.share({title:'My Life Replay',url:url}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){toast('Replay link copied')}).catch(function(){toast('Copy the page URL to share')});else toast('Copy the page URL to share')}
function exportData(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(memories,null,2)],{type:'application/json'}));a.download='life-replay-memories.json';a.click();toast('Backup downloaded')}
function toast(t){var x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(function(){x.remove()},2200)}
function render(){try{if(mode==='story')story();else home()}catch(e){document.getElementById('app').innerHTML='<div class="fatal"><h1>Life Replay</h1><p>We hit a temporary problem.</p><button class="primary" onclick="location.reload()">Refresh</button></div>'}}
load();render();
})();
</script></body></html>
