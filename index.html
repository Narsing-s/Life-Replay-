<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<meta name="description" content="Life Replay turns your memories into a beautiful interactive story.">
<meta property="og:title" content="Life Replay — Turn your life into a story">
<meta property="og:description" content="Collect moments, build your timeline and replay your year.">
<title>Life Replay — Turn your life into a story</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app"><main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;background:#09090d;color:#fff;text-align:center"><div><h1 style="font-size:42px;margin:0 0 12px">Life Replay</h1><p style="opacity:.75">Loading your memories…</p></div></main></div>
<script>
window.addEventListener('error',function(e){
  var app=document.getElementById('app');
  if(app && !app.dataset.ready) app.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;background:#09090d;color:#fff;text-align:center"><div><h1>Life Replay</h1><p>We could not load the app correctly. Please refresh once.</p><small style="opacity:.6">'+String(e.message||'Application error').replace(/[<>]/g,'')+'</small></div></main>';
});
</script>
<script src="./app.js"></script>
</body>
</html>
