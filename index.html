<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1110">
<title>Life Replay — Memory Atlas</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0a0f0e;color:#f4f0e8;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{position:sticky;top:0;height:100vh;padding:26px 18px;border-right:1px solid #ffffff12;background:#0d1412}.logo{font-weight:900;letter-spacing:2px;margin:3px 8px 40px}.logo span{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#d8c6a2;color:#111;margin-right:9px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#aaa;padding:13px 12px;text-align:left;border-radius:12px}.nav button:hover{background:#ffffff0b;color:#fff}.side-bottom{position:absolute;bottom:20px;left:18px;right:18px}.mini{border:1px solid #ffffff14;background:#ffffff07;border-radius:16px;padding:14px;color:#a7aaa5;font-size:12px}.bar{height:76px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;background:#0a0f0ee8;backdrop-filter:blur(18px);z-index:10}.search{width:min(390px,45vw);background:#ffffff08;border:1px solid #ffffff14;border-radius:12px;color:#fff;padding:11px 14px;outline:none}.avatar{width:38px;height:38px;border-radius:50%;border:1px solid #ffffff22;background:#d8c6a2;color:#101311;font-weight:900}.content{max-width:1400px;margin:auto;padding:34px}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8e9891;font-weight:800}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}.intro,.feature{min-height:370px;border-radius:24px;border:1px solid #ffffff12}.intro{padding:38px;background:linear-gradient(145deg,#17201c,#101614)}h1{font-size:clamp(44px,6vw,78px);line-height:.92;letter-spacing:-4px;margin:18px 0}h1 em{font-family:Georgia,serif;font-weight:400;color:#d8c6a2}.intro p{color:#aab1ac;line-height:1.7;max-width:590px}.actions{display:flex;gap:9px;margin-top:28px;flex-wrap:wrap}.btn{border:1px solid #ffffff18;background:#ffffff09;color:#fff;border-radius:11px;padding:11px 15px}.gold{background:#d8c6a2;color:#111;border-color:#d8c6a2;font-weight:800}.feature{overflow:hidden;position:relative;background:#151b18}.feature img{width:100%;height:100%;object-fit:cover}.feature:after{content:'';position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#070a09e8)}.feature-info{position:absolute;z-index:2;bottom:24px;left:24px}.feature-info h2{font:400 32px Georgia,serif;margin:8px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 28px}.metric{background:#ffffff06;border:1px solid #ffffff10;border-radius:15px;padding:18px}.metric b{font-size:25px;display:block}.metric span{font-size:10px;color:#808982;text-transform:uppercase;letter-spacing:1.5px}.section-title{margin:30px 0 15px}.section-title h2{font:400 32px Georgia,serif;margin:6px 0}.wall{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:210px;gap:10px}.memory{position:relative;overflow:hidden;border-radius:17px;border:1px solid #ffffff10;background:#121816;cursor:pointer}.memory:nth-child(1),.memory:nth-child(6){grid-row:span 2}.memory:nth-child(2){grid-column:span 2}.memory img{width:100%;height:100%;object-fit:cover}.memory:after{content:'';position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#050807d9)}.memory-info{position:absolute;z-index:2;bottom:14px;left:15px}.memory-info b{font:400 20px Georgia,serif}.memory-info small{display:block;color:#a7aaa4;margin-top:4px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:50}.modalbox{width:min(460px,100%);background:#111816;border:1px solid #ffffff18;border-radius:20px;padding:25px;box-shadow:0 30px 90px #000}.modalbox h2{font:400 32px Georgia,serif;margin:8px 0 14px}.field{width:100%;padding:13px;margin:7px 0;background:#080c0b;color:#fff;border:1px solid #ffffff16;border-radius:10px}.close{float:right;border:0;background:#ffffff0d;color:#fff;border-radius:50%;width:32px;height:32px}.status{min-height:20px;color:#d8c6a2;font-size:13px;margin:8px 0}.empty{text-align:center;padding:50px;color:#858e88}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#d8c6a2;color:#111;padding:12px 16px;border-radius:12px;z-index:200;font-weight:700}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:static;display:flex;align-items:center;padding:13px 15px;border-right:0;border-bottom:1px solid #ffffff12}.logo{margin:0 18px 0 0}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-bottom{display:none}.bar{padding:0 18px}.content{padding:20px}.hero{grid-template-columns:1fr}.feature{min-height:300px}.metrics{grid-template-columns:repeat(2,1fr)}.wall{grid-template-columns:repeat(2,1fr);grid-auto-rows:180px}.memory:nth-child(2){grid-column:span 2}}@media(max-width:520px){.bar{height:65px}.search{width:70%}.content{padding:14px}.intro{padding:25px}.wall{grid-template-columns:1fr 1fr;grid-auto-rows:145px}.metrics{gap:7px}}
</style></head>
<body><div class="shell"><aside class="side"><div class="logo"><span>✦</span>LIFE REPLAY</div><nav class="nav"><button id="homeBtn">⌂ Home</button><button id="timelineBtn">◷ Timeline</button><button id="replayBtn">▶ Replay</button><button id="photosBtn">◎ Google Photos</button><button id="accountBtn">◉ Account</button></nav><div class="side-bottom"><div class="mini">Your memories stay yours.<br><br><b>Private by design</b></div></div></aside><main class="main"><header class="bar"><input class="search" id="search" placeholder="Search moments, places, years…"><button class="avatar" id="avatar">?</button></header><div class="content" id="app"></div></main></div>
<script>
(()=>{
const BACKEND='https://life-replay.onrender.com';
const API=location.hostname.endsWith('github.io')?BACKEND:location.origin;
const demo=[{id:'1',date:'2026-03-21',title:'A day outside',caption:'A place worth remembering.',place:'Travel',mediaUrl:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1400&q=85'},{id:'2',date:'2026-02-14',title:'Little things',caption:'The moments between the big moments.',place:'City',mediaUrl:'https://images.unsplash.com/photo-1511988617509-a57c8a288659?auto=format&fit=crop&w=1400&q=85'},{id:'3',date:'2025-12-25',title:'Warm December',caption:'Home, light and people who matter.',place:'Home',mediaUrl:'https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=1400&q=85'},{id:'4',date:'2025-08-18',title:'New roads',caption:'Somewhere between here and there.',place:'Road',mediaUrl:'https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1400&q=85'}];
let memories=demo,q='';
const token=()=>localStorage.getItem('lifeReplayToken')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const readableError=value=>{if(value instanceof Error)return value.message||'Something went wrong. If the problem continues, try again.';if(typeof value==='string')return value;if(value&&typeof value==='object'){const v=value.message??value.error??value.detail??value.title;if(typeof v==='string')return v;if(v&&typeof v==='object')return readableError(v);try{return JSON.stringify(value)}catch{return 'Something went wrong. Please try again.'}}return String(value??'Something went wrong. Please try again.')};
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=readableError(t);document.body.append(e);setTimeout(()=>e.remove(),3000)};
async function readJson(response){const text=await response.text();let data=null;try{data=text?JSON.parse(text):null}catch{throw new Error(`Server returned non-JSON response (${response.status})`)}if(!response.ok){throw new Error(readableError(data?.error??data?.message??data)||`Request failed (${response.status})`)}return data}
async function api(path,options={}){const headers={'Accept':'application/json',...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})};const r=await fetch(API+path,{...options,headers});return readJson(r)}
async function load(){if(!token())return render();try{const data=await api('/api/memories',{headers:{Authorization:'Bearer '+token()}});memories=data.memories||[];render()}catch(e){render();toast(e)}}
function render(){const list=memories.filter(m=>!q||[m.title,m.caption,m.place,m.date].join(' ').toLowerCase().includes(q.toLowerCase()));const latest=list[0]||demo[0],years=[...new Set(memories.map(m=>(m.date||'').slice(0,4)))].sort().reverse(),places=new Set(memories.map(m=>m.place));document.getElementById('app').innerHTML=`<section class="hero"><div class="intro"><div class="eyebrow">MEMORY ATLAS · ${new Date().getFullYear()}</div><h1>Remember the<br><em>way it felt.</em></h1><p>One private place for the people, places and tiny moments you never want to lose.</p><div class="actions"><button class="btn gold" id="loginCta">Sign in / Create account</button><button class="btn" id="replayCta">▶ Start Replay</button></div></div><div class="feature"><img src="${esc(latest.mediaUrl)}"><div class="feature-info"><div class="eyebrow">LATEST MEMORY · ${esc(latest.date)}</div><h2>${esc(latest.title)}</h2><small>${esc(latest.place)} · ${esc(latest.caption)}</small></div></div></section><section class="metrics"><div class="metric"><b>${memories.length}</b><span>Memories</span></div><div class="metric"><b>${years.length}</b><span>Years captured</span></div><div class="metric"><b>${places.size}</b><span>Places</span></div><div class="metric"><b>∞</b><span>Stories ahead</span></div></section><div class="section-title"><div class="eyebrow">VISUAL WALL</div><h2>Recent moments</h2></div><section class="wall">${list.map(m=>`<article class="memory" data-id="${esc(m.id)}"><img src="${esc(m.mediaUrl)}"><div class="memory-info"><b>${esc(m.title)}</b><small>${esc(m.date)} · ${esc(m.place)}</small></div></article>`).join('')||'<div class="empty">No matching memories.</div>'}</section>`;document.getElementById('loginCta').onclick=account;document.getElementById('replayCta').onclick=()=>toast('Replay is ready when you have memories');document.querySelectorAll('.memory').forEach(e=>e.onclick=()=>toast(e.querySelector('b').textContent))}
function modal(html){const e=document.createElement('div');e.className='modal';e.innerHTML=`<div class="modalbox">${html}</div>`;document.body.append(e);e.querySelector('.close')?.addEventListener('click',()=>e.remove());return e}
function account(){const x=modal(`<button class="close">×</button><div class="eyebrow">YOUR PRIVATE SPACE</div><h2>Sign in to Life Replay</h2><p style="color:#9da6a0">Use your email and password. Your account is stored by the Life Replay backend.</p><input class="field" id="email" type="email" autocomplete="email" placeholder="Email address"><input class="field" id="password" type="password" autocomplete="current-password" placeholder="Password"><div class="status" id="status"></div><button class="btn gold" id="login">Sign in</button><button class="btn" id="register">Create account</button>`);x.querySelector('#login').onclick=()=>submitAuth(x);x.querySelector('#register').onclick=()=>register(x)}
async function submitAuth(x){const status=x.querySelector('#status');const email=x.querySelector('#email').value.trim();const password=x.querySelector('#password').value;if(!email||!password){status.textContent='Enter your email and password.';return}status.textContent='Signing in…';try{const data=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email,password})});localStorage.setItem('lifeReplayToken',data.token);localStorage.setItem('lifeReplayUser',JSON.stringify(data.user));x.remove();toast('Signed in successfully');await load()}catch(e){status.textContent=readableError(e)}}
async function register(x){const name=prompt('Your name');if(!name)return;const email=x.querySelector('#email').value.trim(),password=x.querySelector('#password').value,status=x.querySelector('#status');if(!email||!password){status.textContent='Enter email and password first.';return}status.textContent='Creating account…';try{const data=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name,email,password})});if(!data?.token)throw new Error('Account was created but the server did not return a sign-in token. Please try signing in.');localStorage.setItem('lifeReplayToken',data.token);localStorage.setItem('lifeReplayUser',JSON.stringify(data.user||{}));x.remove();toast('Account created successfully');await load()}catch(e){status.textContent=readableError(e)}}
document.getElementById('accountBtn').onclick=account;document.getElementById('avatar').onclick=account;document.getElementById('homeBtn').onclick=()=>{q='';render();scrollTo({top:0,behavior:'smooth'})};document.getElementById('timelineBtn').onclick=()=>document.querySelector('.wall')?.scrollIntoView({behavior:'smooth'});document.getElementById('replayBtn').onclick=()=>toast('Replay is ready when you have memories');document.getElementById('photosBtn').onclick=()=>toast('Google Photos import will be connected to your account');document.getElementById('search').oninput=e=>{q=e.target.value;render()};load();
})();
</script></body></html>
