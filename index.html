<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<meta name="description" content="Life Replay turns your memories into a beautiful interactive story.">
<title>Life Replay — Turn your life into a story</title>
<link rel="stylesheet" href="./style.css?v=6">
</head>
<body>
<div id="app"><main style="min-height:100vh;display:grid;place-items:center;background:#09090d;color:#fff;font-family:Arial,sans-serif;text-align:center"><div><h1>Life Replay</h1><p>Starting your memory timeline…</p></div></main></div>
<script>
(function(){
'use strict';
var KEY='life-replay.safe.v1';
var seed=[
{id:1,date:'2026-01-01',title:'A new beginning',caption:'New year, new energy.',place:'Home',src:'https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=1200&q=85'},
{id:2,date:'2026-02-14',title:'Small moments',caption:'The moments worth keeping.',place:'City',src:'https://images.unsplash.com/photo-1511988617509-a57c8a288659?auto=format&fit=crop&w=1200&q=85'},
{id:3,date:'2026-03-21',title:'Out there',caption:'A day that felt different.',place:'Travel',src:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=85'}
];
var memories=seed.slice(),mode='home',query='',place='all';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x)&&x.length)memories=x}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(memories))}catch(e){}}
function filtered(){var q=query.toLowerCase();return memories.filter(function(m){return(!q||(String(m.title)+' '+String(m.caption)+' '+String(m.place)).toLowerCase().indexOf(q)>=0)&&(place==='all'||m.place===place)})}
function stats(){var p={},y={};memories.forEach(function(m){p[m.place]=1;y[String(m.date).slice(0,4)]=1});return{places:Object.keys(p).length,years:Object.keys(y).length}}
function header(){return '<header class="header"><div class="brand" id="home">✦ life replay</div><div class="headerActions"><button class="ghost" id="share">↗ Share</button><button class="ghost" id="export">Export</button></div></header>'}
function render(){if(mode==='story')story();else home()}
function home(){var list=filtered(),s=stats(),places=[],groups={};memories.forEach(function(m){if(places.indexOf(m.place)<0)places.push(m.place)});list.forEach(function(m){var y=String(m.date).slice(0,4);if(!groups[y])groups[y]=[];groups[y].push(m)});places.sort();var years=Object.keys(groups).sort().reverse();var timeline='';years.forEach(function(y){timeline+='<div class="year"><div class="yearLabel">'+esc(y)+'</div><div class="rail">';groups[y].sort(function(a,b){return a.date.localeCompare(b.date)}).forEach(function(m){var d=new Date(m.date+'T00:00:00');timeline+='<article class="memory" data-id="'+esc(m.id)+'"><i class="dot"></i><div class="date">'+d.toLocaleString(undefined,{month:'long'}).toUpperCase()+' · '+d.getDate()+'</div><div class="card"><img src="'+esc(m.src)+'" alt="'+esc(m.title)+'"><div class="body"><h3>'+esc(m.title)+'</h3><p>'+esc(m.caption)+'</p><div class="meta"><span>⌖ '+esc(m.place)+'</span><span>♡</span></div></div></div></article>'});timeline+='</div></div>'});if(!timeline)timeline='<div class="empty">No memories match this view.</div>';
document.getElementById('app').innerHTML=header()+'<main><section class="hero"><div class="eyebrow">✦ YOUR LIFE, REIMAGINED</div><h1>Turn your life<br><em>into a story.</em></h1><p>Keep the moments that matter in one private timeline. Your memories stay in this browser.</p><div class="actions"><button class="primary" id="add">＋ Add memories</button><button class="secondary" id="replay">▶ Replay my year</button></div><input id="files" hidden type="file" accept="image/*" multiple></section><section class="stats"><div><b>'+memories.length+'</b><span>memories</span></div><div><b>'+s.places+'</b><span>places</span></div><div><b>'+s.years+'</b><span>years</span></div><div><b>∞</b><span>stories</span></div></section><section class="tools"><input id="search" placeholder="Search memories…" value="'+esc(query)+'"><select id="place"><option value="all">All places</option>'+places.map(function(p){return '<option value="'+esc(p)+'"'+(p===place?' selected':'')+'>'+esc(p)+'</option>'}).join('')+'</select></section><section class="sectionHead"><div><div class="eyebrow">YOUR TIMELINE</div><h2>Moments that matter</h2></div><button class="add" id="add2">＋</button></section><section class="timeline">'+timeline+'</section><section class="cta"><div class="eyebrow">✦ KEEP GOING</div><h2>There are more stories<br>waiting to be remembered.</h2><button class="primary" id="add3">Add another memory →</button></section></main>';
['add','add2','add3'].forEach(function(id){document.getElementById(id).onclick=function(){document.getElementById('files').click()}});document.getElementById('files').onchange=files;document.getElementById('replay').onclick=function(){mode='story';render()};document.getElementById('home').onclick=function(){mode='home';query='';place='all';render()};document.getElementById('share').onclick=share;document.getElementById('export').onclick=exportData;document.getElementById('search').oninput=function(e){query=e.target.value;home()};document.getElementById('place').onchange=function(e){place=e.target.value;home()};Array.prototype.forEach.call(document.querySelectorAll('.memory'),function(el){el.onclick=function(){open(el.getAttribute('data-id'))}})}
function story(){var s=stats();document.getElementById('app').innerHTML='<div class="story"><button class="back" id="back">← Back to timeline</button><section class="storyIntro"><div class="eyebrow">✦ YOUR REPLAY</div><h1>One year.<br><em>So many moments.</em></h1><p>'+memories.length+' memories across '+s.places+' places.</p><button class="primary" id="storyShare">↗ Share story</button></section><section class="storyGrid">'+memories.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).map(function(m){return '<article class="storyItem"><img src="'+esc(m.src)+'" alt="'+esc(m.title)+'"><div><small>'+esc(m.date)+' · '+esc(m.place)+'</small><h3>'+esc(m.title)+'</h3><p>'+esc(m.caption)+'</p></div></article>'}).join('')+'</section><footer>life replay · your memories, your story.</footer></div>';document.getElementById('back').onclick=function(){mode='home';render()};document.getElementById('storyShare').onclick=share}
function files(e){Array.prototype.forEach.call(e.target.files||[],function(f,i){if(String(f.type).indexOf('image/')!==0)return;var r=new FileReader();r.onload=function(){memories.unshift({id:Date.now()+i,date:new Date(f.lastModified||Date.now()).toISOString().slice(0,10),title:f.name.replace(/\.[^.]+$/,'').replace(/[-_]+/g,' '),caption:'Captured and kept.',place:'My memories',src:r.result});save();render();toast('Memory added ✦')};r.readAsDataURL(f)});e.target.value=''}
function open(id){var m=memories.filter(function(x){return String(x.id)===String(id)})[0];if(!m)return;document.getElementById('app').insertAdjacentHTML('beforeend','<div class="modal" id="modal"><div class="modalBox"><button class="close" id="close">×</button><img src="'+esc(m.src)+'"><div class="modalContent"><small>'+esc(m.date)+' · '+esc(m.place)+'</small><h2>'+esc(m.title)+'</h2><p>'+esc(m.caption)+'</p><button class="danger" id="remove">Remove memory</button></div></div></div>');document.getElementById('close').onclick=close;document.getElementById('modal').onclick=function(e){if(e.target.id==='modal')close()};document.getElementById('remove').onclick=function(){memories=memories.filter(function(x){return String(x.id)!==String(id)});save();close();render()}}
function close(){var x=document.getElementById('modal');if(x)x.remove()}
function share(){var data=btoa(unescape(encodeURIComponent(JSON.stringify(memories.map(function(m){return{id:m.id,date:m.date,title:m.title,caption:m.caption,place:m.place}})))));var url=location.href.split('#')[0]+'#replay='+data;if(navigator.share)navigator.share({title:'My Life Replay',url:url}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){toast('Share link copied')}).catch(function(){toast('Copy the page URL to share')});else toast('Copy the page URL to share')}
function exportData(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(memories,null,2)],{type:'application/json'}));a.download='life-replay-memories.json';a.click();toast('Backup downloaded')}
function toast(t){var x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(function(){x.remove()},2000)}
try{load();render()}catch(e){document.getElementById('app').innerHTML='<main style="min-height:100vh;display:grid;place-items:center;background:#09090d;color:#fff;font-family:Arial;text-align:center"><div><h1>Life Replay</h1><p>Startup failed safely.</p><button onclick="location.reload()">Refresh</button></div></main>'}
try{if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}catch(e){}
})();
</script>
</body>
</html>
