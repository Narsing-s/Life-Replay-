<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090d"><title>Life Replay — Your life, beautifully remembered</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#09090d;color:#f7f4ef;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{background:radial-gradient(circle at 15% 0,#8b5cf633,transparent 32%),radial-gradient(circle at 90% 10%,#38bdf822,transparent 28%),#09090d}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.top{height:72px;border-bottom:1px solid #ffffff18;display:flex;align-items:center;position:sticky;top:0;background:#09090ddd;backdrop-filter:blur(18px);z-index:5}.top .wrap{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:2px}.brand span{color:#d9baff}.nav{display:flex;gap:8px}.btn{border:1px solid #ffffff20;background:#ffffff09;color:#fff;border-radius:12px;padding:10px 15px;cursor:pointer}.primary{background:#f3eee7;color:#111;font-weight:800;border:0}.hero{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;padding:70px 0}.eyebrow{font-size:10px;letter-spacing:2px;color:#a59cac;font-weight:800}.hero h1{font:800 clamp(50px,7vw,86px)/.9 system-ui;margin:18px 0}.hero h1 em,.cta em{font:400 1em Georgia,serif;color:#dbc8e9}.hero p{font-size:18px;line-height:1.7;color:#aaa3ae}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.heroimg{height:500px;border-radius:28px;overflow:hidden;border:1px solid #ffffff20;position:relative}.heroimg img{width:100%;height:100%;object-fit:cover}.caption{position:absolute;left:18px;right:18px;bottom:18px;padding:17px;border:1px solid #ffffff22;border-radius:16px;background:#09090dcc}.caption b{display:block;font:400 27px Georgia,serif;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#ffffff18;border-radius:18px;overflow:hidden}.stat{text-align:center;background:#ffffff08;padding:24px}.stat b{display:block;font-size:30px}.stat span{color:#88818e;text-transform:uppercase;font-size:10px;letter-spacing:1.5px}.section{padding:70px 0}.head{display:flex;justify-content:space-between;gap:15px;align-items:end}.head h2{font:400 42px Georgia,serif;margin:8px 0 0}.input{background:#ffffff09;color:#eee;border:1px solid #ffffff20;border-radius:11px;padding:11px}.timeline{margin-top:35px}.memory{display:grid;grid-template-columns:220px 1fr;background:#17151e;border:1px solid #ffffff15;border-radius:20px;overflow:hidden;margin:16px 0;cursor:pointer}.memory img{width:100%;height:190px;object-fit:cover}.memorybody{padding:22px}.memorybody small{color:#8e8794}.memorybody h3{font:400 28px Georgia,serif;margin:9px 0}.memorybody p{color:#9f98a4;line-height:1.5}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:55px}.quick .btn{text-align:left;padding:20px}.quick b{display:block}.quick small{color:#88818e}.cta{display:flex;justify-content:space-between;align-items:center;padding:40px;margin:30px 0 70px;border:1px solid #ffffff18;border-radius:24px;background:#ffffff08}.cta h2{font:400 40px Georgia,serif}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:20}.box{width:min(520px,100%);background:#17151e;border:1px solid #ffffff20;border-radius:22px;padding:28px}.box h2{font:400 34px Georgia,serif}.box p{color:#aaa3ae;line-height:1.6}.close{float:right;border:0;background:#ffffff10;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer}.empty{text-align:center;color:#888;padding:60px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f3eee7;color:#111;padding:12px 16px;border-radius:12px;z-index:50}@media(max-width:800px){.nav{display:none}.hero{grid-template-columns:1fr;padding:45px 0}.heroimg{height:380px}.quick{grid-template-columns:1fr}.head{display:block}.memory{grid-template-columns:1fr}.memory img{height:220px}.cta{display:block}.cta h2{font-size:34px}}
</style></head><body><header class="top"><div class="wrap"><div class="brand"><span>✦</span> LIFE REPLAY</div><div class="nav"><button class="btn" id="timelineBtn">Timeline</button><button class="btn" id="replayBtn">Replay</button><button class="btn" id="photosBtn">Google Photos</button></div></div></header><div id="app"></div><script>(function(){'use strict';var key='life-replay-safe-v5',seed=[{id:'1',date:'2026-03-21',title:'Out there',caption:'A day that felt different.',place:'Travel',src:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1400&q=85'},{id:'2',date:'2026-02-14',title:'Small moments',caption:'The moments worth keeping.',place:'City',src:'https://images.unsplash.com/photo-1511988617509-a57c8a288659?auto=format&fit=crop&w=1400&q=85'},{id:'3',date:'2026-01-01',title:'A new beginning',caption:'New year, new energy.',place:'Home',src:'https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=1400&q=85'}],memories=seed.slice(),query='';try{var saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved)&&saved.length)memories=saved}catch(e){}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function save(){try{localStorage.setItem(key,JSON.stringify(memories))}catch(e){}}function toast(t){var x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(function(){x.remove()},1800)}function render(){var list=memories.filter(function(m){return !query||[m.title,m.caption,m.place].join(' ').toLowerCase().indexOf(query.toLowerCase())>=0}),latest=memories[0]||seed[0],places={},years={};memories.forEach(function(m){places[m.place]=1;years[m.date.slice(0,4)]=1});var cards=list.map(function(m){return '<article class="memory" data-id="'+esc(m.id)+'"><img src="'+esc(m.src)+'" alt=""><div class="memorybody"><small>'+esc(m.date)+' · '+esc(m.place)+'</small><h3>'+esc(m.title)+'</h3><p>'+esc(m.caption)+'</p><button class="btn">View memory →</button></div></article>'}).join('');document.getElementById('app').innerHTML='<main class="wrap"><section class="hero"><div><div class="eyebrow">✦ YOUR PERSONAL MEMORY SPACE</div><h1>Your life,<br><em>beautifully remembered.</em></h1><p>One private place for the moments that made you who you are — ready to become stories.</p><div class="actions"><button class="btn primary" id="add">＋ Add memories</button><button class="btn" id="photos">◎ Connect Google Photos</button></div></div><div class="heroimg"><img src="'+esc(latest.src)+'" alt="Latest memory"><div class="caption"><span class="eyebrow">LATEST MEMORY</span><b>'+esc(latest.title)+'</b><small>'+esc(latest.date)+' · '+esc(latest.place)+'</small></div></div></section><section class="stats"><div class="stat"><b>'+memories.length+'</b><span>Memories</span></div><div class="stat"><b>'+Object.keys(places).length+'</b><span>Places</span></div><div class="stat"><b>'+Object.keys(years).length+'</b><span>Years</span></div></section><section class="quick"><button class="btn" id="replay"><b>▶ Replay your life</b><small>Turn your timeline into a story</small></button><button class="btn" id="photos2"><b>◎ Bring your photos</b><small>Choose memories from Google Photos</small></button><button class="btn" id="add2"><b>＋ Create a memory</b><small>Add photos from your device</small></button></section><section class="section"><div class="head"><div><div class="eyebrow">MEMORY TIMELINE</div><h2>Moments that matter</h2></div><input class="input" id="search" placeholder="Search memories…" value="'+esc(query)+'"></div><div class="timeline">'+(cards||'<div class="empty">No memories match your search.</div>')+'</div></section><section class="cta"><div><div class="eyebrow">✦ YOUR STORY IS STILL BEING WRITTEN</div><h2>Make room for<br><em>what comes next.</em></h2></div><button class="btn primary" id="add3">＋ Add a memory</button></section></main>';['add','add2','add3'].forEach(function(id){document.getElementById(id).onclick=chooseFiles});['photos','photos2'].forEach(function(id){document.getElementById(id).onclick=googlePhotos});document.getElementById('photosBtn').onclick=googlePhotos;document.getElementById('timelineBtn').onclick=function(){query='';render()};document.getElementById('replay').onclick=replay;document.getElementById('replayBtn').onclick=replay;document.getElementById('search').oninput=function(e){query=e.target.value;render()};document.querySelectorAll('.memory').forEach(function(x){x.onclick=function(){detail(x.getAttribute('data-id'))}})}function chooseFiles(){var i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=function(){Array.prototype.forEach.call(i.files,function(f,n){if(f.type.indexOf('image/')!==0)return;var r=new FileReader();r.onload=function(){memories.unshift({id:String(Date.now())+n,date:new Date(f.lastModified||Date.now()).toISOString().slice(0,10),title:f.name.replace(/\.[^.]+$/,''),caption:'Captured and kept.',place:'My memories',src:r.result});save();render();toast('Memory added ✦')};r.readAsDataURL(f)})};i.click()}function detail(id){var m=memories.filter(function(x){return x.id===id})[0];if(!m)return;var x=document.createElement('div');x.className='modal';x.innerHTML='<div class="box"><button class="close">×</button><img src="'+esc(m.src)+'" style="width:100%;max-height:400px;object-fit:cover;border-radius:14px"><p>'+esc(m.date)+' · '+esc(m.place)+'</p><h2>'+esc(m.title)+'</h2><p>'+esc(m.caption)+'</p><button class="btn" id="delete">Remove memory</button></div>';document.body.appendChild(x);x.querySelector('.close').onclick=function(){x.remove()};x.querySelector('#delete').onclick=function(){memories=memories.filter(function(a){return a.id!==id});save();x.remove();render()}}function googlePhotos(){var x=document.createElement('div');x.className='modal';x.innerHTML='<div class="box"><button class="close">×</button><div class="eyebrow">GOOGLE PHOTOS</div><h2>Bring your memories with you.</h2><p>The timeline is fully usable without Google. The Photos connector can be configured separately with a Google OAuth Web Client ID.</p><button class="btn primary" id="ok">Continue</button></div>';document.body.appendChild(x);x.querySelector('.close').onclick=function(){x.remove()};x.querySelector('#ok').onclick=function(){x.remove()}}function replay(){document.getElementById('app').innerHTML='<main class="wrap section"><button class="btn" id="back">← Timeline</button><div style="text-align:center;padding:60px 0"><div class="eyebrow">✦ YOUR REPLAY</div><h1 style="font:400 clamp(50px,8vw,90px)/.95 Georgia,serif">The moments<br><em>that made your story.</em></h1></div>'+memories.map(function(m){return '<article class="memory"><img src="'+esc(m.src)+'"><div class="memorybody"><small>'+esc(m.date)+' · '+esc(m.place)+'</small><h3>'+esc(m.title)+'</h3><p>'+esc(m.caption)+'</p></div></article>'}).join('')+'</main>';document.getElementById('back').onclick=render}render()})();</script></body></html>
