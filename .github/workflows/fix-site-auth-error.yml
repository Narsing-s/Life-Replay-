name: Fix site auth error rendering
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site error handling
        shell: python
        run: |
          from pathlib import Path
          p=Path('site/index.html')
          t=p.read_text(encoding='utf-8')
          old="if(!r.ok)throw new Error(d?.error||`Request failed (${r.status})`);"
          new="if(!r.ok){const message=typeof d?.error==='string'?d.error:(d?.error?.message||d?.message||(d?.error?JSON.stringify(d.error):`Request failed (${r.status})`));throw new Error(message);}"
          if old not in t:
              raise SystemExit('expected site error handler was not found')
          p.write_text(t.replace(old,new),encoding='utf-8')
          Path('.github/workflows/fix-site-auth-error.yml').unlink()
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html .github/workflows/fix-site-auth-error.yml
          git commit -m 'fix: show readable site auth errors'
          git push