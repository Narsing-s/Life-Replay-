name: Fix auth error rendering
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend error handling
        shell: python
        run: |
          from pathlib import Path
          files = [Path('index.html'), Path('site/index.html')]
          old = "if(!response.ok)throw new Error(data?.error||`Request failed (${response.status})`);"
          new = "if(!response.ok){const message=typeof data?.error==='string'?data.error:(data?.error?.message||data?.message||(data?.error?JSON.stringify(data.error):`Request failed (${response.status})`));throw new Error(message);}"
          for path in files:
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
          wf=Path('.github/workflows/fix-auth-error.yml')
          if wf.exists(): wf.unlink()
      - name: Commit patched frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html site/index.html .github/workflows/fix-auth-error.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: show readable auth errors'
          git push