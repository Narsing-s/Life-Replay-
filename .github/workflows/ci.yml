name: CI

on:
  push:
    branches: [main, feature/life-replay-production-hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Production Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file infrastructure/docker/Dockerfile --tag life-replay:ci .

  infrastructure:
    name: Infrastructure config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infrastructure/docker/docker-compose.production.yml config
