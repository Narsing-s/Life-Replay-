<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090d">
<title>Life Replay — Finding your memories</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#32245d 0,transparent 35%),radial-gradient(circle at 80% 90%,#163e4b 0,transparent 35%),#09090d;color:#fff;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(560px,100%);padding:42px;border:1px solid #ffffff20;border-radius:28px;background:#ffffff0b;backdrop-filter:blur(20px);box-shadow:0 30px 100px #0008;text-align:center}.mark{font-size:42px}.eyebrow{letter-spacing:.16em;font-size:11px;font-weight:800;opacity:.65}h1{font-size:clamp(34px,8vw,58px);line-height:.98;margin:14px 0}p{opacity:.7}.button{display:inline-block;margin-top:14px;padding:13px 20px;border-radius:999px;background:#fff;color:#09090d;text-decoration:none;font-weight:800}</style>
</head>
<body>
<main class="card">
<div class="mark">✦</div>
<div class="eyebrow">LIFE REPLAY</div>
<h1>Your story is still here.</h1>
<p>This page moved back to the main Life Replay experience.</p>
<a class="button" href="./">Return to Life Replay</a>
</main>
<script>
(function(){
  var base=location.pathname.replace(/\/404\.html?$/,'/');
  if(location.pathname.indexOf('/Life-Replay-/')>=0){base='/Life-Replay-/';}
  setTimeout(function(){location.replace(base+location.search+location.hash)},1200);
})();
</script>
</body>
</html>
