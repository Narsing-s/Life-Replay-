<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1110"><title>Life Replay — Memory Atlas</title><style>*{box-sizing:border-box}html,body{margin:0;background:#0a0f0e;color:#f4f0e8;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{position:sticky;top:0;height:100vh;padding:26px 18px;border-right:1px solid #ffffff12;background:#0d1412}.logo{font-weight:900;letter-spacing:2px;font-size:15px;margin:3px 8px 40px}.logo span{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#d8c6a2;color:#111;margin-right:9px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#aaa;padding:13px 12px;text-align:left;border-radius:12px}.nav button.active,.nav button:hover{background:#ffffff0b;color:#fff}.side-bottom{position:absolute;bottom:20px;left:18px;right:18px}.mini{border:1px solid #ffffff14;background:#ffffff07;border-radius:16px;padding:14px;color:#a7aaa5;font-size:12px}.main{min-width:0}.bar{height:76px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;background:#0a0f0ee8;backdrop-filter:blur(18px);z-index:10}.search{width:min(390px,45vw);background:#ffffff08;border:1px solid #ffffff14;border-radius:12px;color:#fff;padding:11px 14px;outline:none}.avatar{width:38px;height:38px;border-radius:50%;border:1px solid #ffffff22;background:#d8c6a2;color:#101311;font-weight:900}.content{max-width:1400px;margin:auto;padding:34px}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8e9891;font-weight:800}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;margin-bottom:22px}.intro{min-height:370px;border-radius:24px;padding:38px;background:linear-gradient(145deg,#17201c,#101614);border:1px solid #ffffff12;position:relative;overflow:hidden}.intro:after{content:'';position:absolute;width:280px;height:280px;border-radius:50%;right:-90px;bottom:-120px;background:#d8c6a220;filter:blur(8px)}h1{font-size:clamp(44px,6vw,78px);line-height:.92;letter-spacing:-4px;margin:18px 0;max-width:700px}h1 em{font-family:Georgia,serif;font-weight:400;color:#d8c6a2}.intro p{color:#aab1ac;line-height:1.7;max-width:590px}.actions{display:flex;gap:9px;margin-top:28px;flex-wrap:wrap}.btn{border:1px solid #ffffff18;background:#ffffff09;color:#fff;border-radius:11px;padding:11px 15px}.btn:hover{background:#ffffff14}.gold{background:#d8c6a2;color:#111;border-color:#d8c6a2;font-weight:800}.feature{height:370px;border-radius:24px;overflow:hidden;position:relative;border:1px solid #ffffff14;background:#151b18}.feature img{width:100%;height:100%;object-fit:cover;display:block}.feature:after{content:'';position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#070a09e8)}.feature-info{position:absolute;z-index:2;bottom:24px;left:24px}.feature-info h2{font:400 32px Georgia,serif;margin:8px 0}.feature-info small{color:#b2b5af}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 28px}.metric{background:#ffffff06;border:1px solid #ffffff10;border-radius:15px;padding:18px}.metric b{font-size:25px;display:block}.metric span{font-size:10px;color:#808982;text-transform:uppercase;letter-spacing:1.5px}.section-title{display:flex;justify-content:space-between;align-items:end;margin:30px 0 15px}.section-title h2{font:400 32px Georgia,serif;margin:6px 0}.wall{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:210px;gap:10px}.memory{position:relative;overflow:hidden;border-radius:17px;border:1px solid #ffffff10;background:#121816;cursor:pointer}.memory:nth-child(1),.memory:nth-child(6){grid-row:span 2}.memory:nth-child(2){grid-column:span 2}.memory img{width:100%;height:100%;object-fit:cover;transition:.45s}.memory:hover img{transform:scale(1.06)}.memory:after{content:'';position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#050807d9)}.memory-info{position:absolute;z-index:2;bottom:14px;left:15px;right:15px}.memory-info b{font:400 20px Georgia,serif}.memory-info small{display:block;color:#a7aaa4;margin-top:4px}.years{display:flex;gap:8px;overflow:auto;padding-bottom:6px}.yearpill{white-space:nowrap;border:1px solid #ffffff15;background:#ffffff06;color:#aaa;border-radius:20px;padding:8px 14px}.timeline{border-left:1px solid #ffffff15;margin:20px 0 0 12px;padding-left:24px}.event{position:relative;margin:0 0 22px;padding:18px;border:1px solid #ffffff10;background:#ffffff05;border-radius:16px}.event:before{content:'';position:absolute;left:-31px;top:24px;width:11px;height:11px;border-radius:50%;background:#d8c6a2;box-shadow:0 0 0 5px #0a0f0e}.event strong{font-family:Georgia,serif;font-size:21px}.event small{color:#8e9891}.empty{padding:50px;text-align:center;color:#858e88}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:50}.modalbox{width:min(480px,100%);background:#111816;border:1px solid #ffffff18;border-radius:20px;padding:25px;box-shadow:0 30px 90px #000}.modalbox h2{font:400 32px Georgia,serif;margin:8px 0 14px}.field{width:100%;padding:13px;margin:7px 0;background:#080c0b;color:#fff;border:1px solid #ffffff16;border-radius:10px}.close{float:right;border:0;background:#ffffff0d;color:#fff;border-radius:50%;width:32px;height:32px}.viewer{position:fixed;inset:0;background:#050807f8;z-index:100;display:grid;grid-template-rows:auto 1fr auto}.viewer-top,.viewer-bottom{padding:18px;display:flex;justify-content:space-between;gap:8px}.viewer-stage{display:grid;place-items:center;padding:10px}.viewer-stage img{max-width:88vw;max-height:72vh;border-radius:16px;object-fit:contain}.viewer-meta{text-align:center}.viewer-meta h2{font:400 32px Georgia,serif;margin:8px}.counter{position:absolute;top:27px;left:50%;transform:translateX(-50%);color:#929a94;font-size:12px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#d8c6a2;color:#111;padding:12px 16px;border-radius:12px;z-index:200;font-weight:700}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:static;display:flex;align-items:center;padding:13px 15px;border-right:0;border-bottom:1px solid #ffffff12}.logo{margin:0 18px 0 0}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-bottom{display:none}.bar{padding:0 18px}.content{padding:20px}.hero{grid-template-columns:1fr}.feature{height:300px}.metrics{grid-template-columns:repeat(2,1fr)}.wall{grid-template-columns:repeat(2,1fr);grid-auto-rows:180px}.memory:nth-child(1),.memory:nth-child(6){grid-row:span 2}.memory:nth-child(2){grid-column:span 2}}@media(max-width:520px){.bar{height:65px}.search{width:70%}.content{padding:14px}.intro{min-height:410px;padding:25px}h1{letter-spacing:-2px}.wall{grid-template-columns:1fr 1fr;grid-auto-rows:145px}.memory:nth-child(2){grid-column:span 1}.metrics{gap:7px}.metric{padding:14px}.metric b{font-size:20px}}</style></head><body><div class="shell"><aside class="side"><div class="logo"><span>✦</span>LIFE REPLAY</div><nav class="nav"><button class="active" id="home">⌂ Home</button><button id="timelineBtn">◷ Timeline</button><button id="replayBtn">▶ Replay</button><button id="photosBtn">◎ Google Photos</button><button id="accountBtn">◉ Account</button></nav><div class="side-bottom"><div class="mini">Your memories stay yours.<br><br><b>Private by design</b></div></div></aside><main class="main"><header class="bar"><input class="search" id="search" placeholder="Search moments, places, years…"><button class="avatar" id="avatar">?</button></header><div class="content" id="app"></div></main></div><script>(()=>{const demo=[{id:'1',date:'2026-03-21',title:'A day outside',caption:'A place worth remembering.',place:'Travel',mediaUrl:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1400&q=85'},{id:'2',date:'2026-02-14',title:'Little things',caption:'The moments between the big moments.',place:'City',mediaUrl:'https://images.unsplash.com/photo-1511988617509-a57c8a288659?auto=format&fit=crop&w=1400&q=85'},{id:'3',date:'2025-12-25',title:'Warm December',caption:'Home, light and people who matter.',place:'Home',mediaUrl:'https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=1400&q=85'},{id:'4',date:'2025-08-18',title:'New roads',caption:'Somewhere between here and there.',place:'Road',mediaUrl:'https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1400&q=85'},{id:'5',date:'2024-11-04',title:'Golden hour',caption:'A quiet evening.',place:'Outside',mediaUrl:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1400&q=80'},{id:'6',date:'2024-06-12',title:'A new chapter',caption:'Keep going.',place:'City',mediaUrl:'https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1400&q=85'}];let memories=demo,q='';const token=()=>localStorage.getItem('lifeReplayToken')||'',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!token())return render();try{const r=await fetch(location.origin+'/api/memories',{headers:{Authorization:'Bearer '+token()}});if(!r.ok)throw 0;memories=(await r.json()).memories||[];render()}catch(e){render();toast('Showing demo timeline')}}function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),1800)}function render(){const list=memories.filter(m=>!q||[m.title,m.caption,m.place,m.date].join(' ').toLowerCase().includes(q.toLowerCase())),years=[...new Set(memories.map(m=>(m.date||'').slice(0,4)))].sort().reverse(),places=new Set(memories.map(m=>m.place)),latest=list[0]||demo[0];document.getElementById('app').innerHTML='<section class="hero"><div class="intro"><div class="eyebrow">MEMORY ATLAS · '+new Date().getFullYear()+'</div><h1>Remember the<br><em>way it felt.</em></h1><p>One private place for the people, places and tiny moments you never want to lose. Browse your life like a visual map — then press replay.</p><div class="actions"><button class="btn gold" id="connect">◎ Import Google Photos</button><button class="btn" id="replay">▶ Start Replay</button></div></div><div class="feature"><img src="'+esc(latest.mediaUrl)+'"><div class="feature-info"><div class="eyebrow">LATEST MEMORY · '+esc(latest.date)+'</div><h2>'+esc(latest.title)+'</h2><small>'+esc(latest.place)+' · '+esc(latest.caption)+'</small></div></div></section><section class="metrics"><div class="metric"><b>'+memories.length+'</b><span>Memories</span></div><div class="metric"><b>'+years.length+'</b><span>Years captured</span></div><div class="metric"><b>'+places.size+'</b><span>Places</span></div><div class="metric"><b>∞</b><span>Stories ahead</span></div></section><div class="section-title"><div><div class="eyebrow">VISUAL WALL</div><h2>Recent moments</h2></div></div><section class="wall">'+list.slice(0,8).map(m=>'<article class="memory" data-id="'+esc(m.id)+'"><img src="'+esc(m.mediaUrl)+'"><div class="memory-info"><b>'+esc(m.title)+'</b><small>'+esc(m.date)+' · '+esc(m.place)+'</small></div></article>').join('')+'</section><div class="section-title"><div><div class="eyebrow">TIME MACHINE</div><h2>Choose a year</h2></div></div><div class="years">'+years.map(y=>'<button class="yearpill" data-year="'+y+'">'+y+'</button>').join('')+'</div><div class="timeline" id="time">'+list.map(m=>'<article class="event"><small>'+esc(m.date)+' · '+esc(m.place)+'</small><br><strong>'+esc(m.title)+'</strong><div style="color:#969f99;margin-top:6px">'+esc(m.caption)+'</div></article>').join('')+'</div>';document.getElementById('connect').onclick=()=>toast('Connect Google Photos from the production app');document.getElementById('replay').onclick=()=>viewer(0);document.querySelectorAll('.memory').forEach(e=>e.onclick=()=>viewer(Math.max(0,memories.findIndex(m=>m.id===e.dataset.id))));document.querySelectorAll('.yearpill').forEach(e=>e.onclick=()=>{q=e.dataset.year;render();document.getElementById('time').scrollIntoView({behavior:'smooth'})})}function viewer(start){const arr=memories.length?memories:demo;let i=start||0,x=document.createElement('div');x.className='viewer';x.innerHTML='<div class="viewer-top"><button class="btn" id="back">← Close</button><div class="counter" id="count"></div><button class="btn" id="x">×</button></div><div class="viewer-stage"><div><img id="img"><div class="viewer-meta"><div class="eyebrow" id="date"></div><h2 id="title"></h2><div id="caption" style="color:#8f9892"></div></div></div></div><div class="viewer-bottom"><button class="btn" id="prev">← Previous</button><button class="btn gold" id="next">Next memory →</button></div>';document.body.append(x);const draw=()=>{const m=arr[i];x.querySelector('#img').src=m.mediaUrl;x.querySelector('#date').textContent=m.date+' · '+m.place;x.querySelector('#title').textContent=m.title;x.querySelector('#caption').textContent=m.caption;x.querySelector('#count').textContent=(i+1)+' / '+arr.length};x.querySelector('#next').onclick=()=>{i=(i+1)%arr.length;draw()};x.querySelector('#prev').onclick=()=>{i=(i-1+arr.length)%arr.length;draw()};x.querySelectorAll('#back,#x').forEach(b=>b.onclick=()=>x.remove());draw()}document.getElementById('search').oninput=e=>{q=e.target.value;render()};document.getElementById('timelineBtn').onclick=()=>document.getElementById('time')?.scrollIntoView({behavior:'smooth'});document.getElementById('replayBtn').onclick=()=>viewer(0);document.getElementById('photosBtn').onclick=()=>toast('Google Photos is available on the production app');document.getElementById('home').onclick=()=>scrollTo({top:0,behavior:'smooth'});load()})();</script></body></html>
