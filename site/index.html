<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080c"><title>Life Replay — Your life, beautifully remembered</title><style>:root{--bg:#08080c;--card:#17151e;--line:#ffffff1c;--muted:#a8a1ad;--accent:#d9baff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#a870ff22,transparent 30%),radial-gradient(circle at 90% 10%,#50c0ff18,transparent 25%),var(--bg);color:#faf7f2;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1160px;margin:auto;padding:0 20px}.top{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:#08080ccc;backdrop-filter:blur(18px);z-index:5}.brand{border:0;background:none;color:#fff;font-weight:900;letter-spacing:2px}.brand:first-letter{color:var(--accent)}nav{display:flex;gap:7px}button{cursor:pointer;font:inherit}.ghost{background:#ffffff09;border:1px solid var(--line);color:#eee;border-radius:12px;padding:10px 14px}.primary{background:linear-gradient(135deg,#fffaf1,#d9cce1);border:0;color:#111;border-radius:13px;padding:13px 17px;font-weight:800}.hero{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:center;padding:75px 0}.eyebrow{font-size:9px;letter-spacing:2.3px;color:#968d9e;font-weight:800}.hero h1{font-size:clamp(52px,7vw,92px);line-height:.9;letter-spacing:-5px;margin:18px 0 25px}.hero em,.cta em,.story h1 em{font:400 1em Georgia,serif;color:#ddc8ea}.hero p{color:var(--muted);font-size:17px;line-height:1.7}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:28px}.heroImg{height:520px;position:relative;overflow:hidden;border-radius:28px;border:1px solid var(--line)}.heroImg img{width:100%;height:100%;object-fit:cover}.caption{position:absolute;left:18px;right:18px;bottom:18px;padding:16px;border:1px solid var(--line);border-radius:16px;background:#09090dcc;backdrop-filter:blur(12px)}.caption b{display:block;font:400 27px Georgia,serif;margin:6px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:18px;overflow:hidden;margin-bottom:50px}.stat{background:#ffffff08;text-align:center;padding:22px}.stat b{display:block;font-size:27px}.stat span{font-size:9px;color:#827a88;text-transform:uppercase;letter-spacing:1.4px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:75px}.quick button{display:flex;gap:13px;align-items:center;text-align:left;background:var(--card);color:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.quick i{font-size:23px;color:var(--accent);font-style:normal}.quick small{display:block;color:#85808b;margin-top:4px}.head{display:flex;justify-content:space-between;align-items:end;gap:15px}.head h2{font:400 40px Georgia,serif;margin:8px 0}.filters{display:flex;gap:7px}.filters input,.filters select{background:#ffffff08;color:#ddd;border:1px solid var(--line);border-radius:11px;padding:10px}.year{display:grid;grid-template-columns:65px 1fr;gap:22px;margin-top:35px}.year>strong{color:#77717d;padding-top:8px}.rail{border-left:1px solid var(--line);padding-left:25px}.memory{display:grid;grid-template-columns:250px 1fr;background:var(--card);border:1px solid var(--line);border-radius:19px;overflow:hidden;margin-bottom:28px;cursor:pointer}.memory img{width:100%;height:205px;object-fit:cover}.memory div{padding:22px}.memory h3{font:400 27px Georgia,serif;margin:8px 0}.memory p{color:#98919c;line-height:1.55}.memory small{color:#817986}.cta{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:70px 0;padding:40px;border:1px solid var(--line);border-radius:24px;background:#ffffff08}.cta h2{font:400 42px Georgia,serif}.modal{position:fixed;inset:0;z-index:20;background:#000b;backdrop-filter:blur(15px);display:grid;place-items:center;padding:18px}.box{width:min(500px,100%);background:#17151e;border:1px solid var(--line);border-radius:23px;padding:30px;position:relative}.box h2{font:400 34px Georgia,serif}.box p{color:var(--muted);line-height:1.6}.box input{width:100%;padding:13px;margin:8px 0 12px;background:#0c0b10;border:1px solid var(--line);border-radius:11px;color:#fff}.close{position:absolute;right:12px;top:12px;border:1px solid var(--line);background:#ffffff0d;color:#fff;border-radius:50%;width:34px;height:34px}.full{width:100%;margin-top:8px}.story{padding:35px 0 80px}.story h1{text-align:center;font:400 clamp(55px,8vw,90px)/.9 Georgia,serif;margin:70px 0 20px}.story p{text-align:center;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:45px}.storyCard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}.storyCard img{width:100%;height:300px;object-fit:cover}.storyCard div{padding:17px}.empty{text-align:center;padding:70px;color:#777}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f5f0e8;color:#111;padding:12px 16px;border-radius:12px;z-index:50}@media(max-width:800px){nav{display:none}.hero{grid-template-columns:1fr;padding:50px 0}.heroImg{height:400px}.quick{grid-template-columns:1fr}.head{display:block}.filters{margin-top:12px}.filters input{width:100%}.year{grid-template-columns:1fr}.rail{padding-left:15px}.memory{grid-template-columns:1fr}.memory img{height:220px}.cta{display:block;padding:28px}.cta h2{font-size:34px}.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap" style="width:100%;display:flex;justify-content:space-between;align-items:center"><button class="brand" id="home">✦ LIFE REPLAY</button><nav><button class="ghost" id="timeline">Timeline</button><button class="ghost" id="replay">Replay</button><button class="ghost" id="google">Google Photos</button></nav></div></header><main class="wrap" id="app"></main><script>(function(){const K='life-replay.safe.v4';const seed=[{id:'1',date:'2026-01-01',title:'A new beginning',caption:'New year, new energy.',place:'Home',src:'https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=1400&q=88'},{id:'2',date:'2026-02-14',title:'Small moments',caption:'The moments worth keeping.',place:'City',src:'https://images.unsplash.com/photo-1511988617509-a57c8a288659?auto=format&fit=crop&w=1400&q=88'},{id:'3',date:'2026-03-21',title:'Out there',caption:'A day that felt different.',place:'Travel',src:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1400&q=88'}];let m=[];let q='',p='all';try{m=JSON.parse(localStorage.getItem(K))||seed.slice()}catch(e){m=seed.slice()}const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(K,JSON.stringify(m))}catch(x){}};const toast=t=>{let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2000)};function render(){let a=m.filter(x=>(!q||[x.title,x.caption,x.place].join(' ').toLowerCase().includes(q.toLowerCase()))&&(p==='all'||x.place===p)),latest=[...m].sort((a,b)=>b.date.localeCompare(a.date))[0]||seed[0],places=[...new Set(m.map(x=>x.place))],years=[...new Set(m.map(x=>x.date.slice(0,4)))],groups={};a.forEach(x=>(groups[x.date.slice(0,4)]??=[]).push(x));let t=Object.keys(groups).sort().reverse().map(y=>`<div class="year"><strong>${y}</strong><div class="rail">${groups[y].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<article class="memory" data-id="${e(x.id)}"><img src="${e(x.src)}"><div><small>${e(x.date)} · ${e(x.place)}</small><h3>${e(x.title)}</h3><p>${e(x.caption)}</p></div></article>`).join('')}</div></div>`).join('');app.innerHTML=`<section class="hero"><div><span class="eyebrow">✦ YOUR PERSONAL MEMORY SPACE</span><h1>Your life,<br><em>beautifully remembered.</em></h1><p>One private place for the moments that made you who you are — ready to become stories.</p><div class="actions"><button class="primary" id="add">＋ Add memories</button><button class="ghost" id="connect">◎ Connect Google Photos</button></div></div><div class="heroImg"><img src="${e(latest.src)}"><div class="caption"><span class="eyebrow">LATEST MEMORY</span><b>${e(latest.title)}</b><small>${e(latest.date)} · ${e(latest.place)}</small></div></div></section><section class="stats"><div class="stat"><b>${m.length}</b><span>Memories</span></div><div class="stat"><b>${places.length}</b><span>Places</span></div><div class="stat"><b>${years.length}</b><span>Years</span></div></section><section class="quick"><button id="qr"><i>▶</i><span><b>Replay your life</b><small>Turn your timeline into a story</small></span></button><button id="qg"><i>◎</i><span><b>Bring your photos</b><small>Choose memories from Google Photos</small></span></button><button id="qa"><i>＋</i><span><b>Create a memory</b><small>Add photos from your device</small></span></button></section><section><div class="head"><div><span class="eyebrow">MEMORY TIMELINE</span><h2>Moments that matter</h2></div><div class="filters"><input id="search" value="${e(q)}" placeholder="Search memories…"><select id="place"><option value="all">All places</option>${places.map(x=>`<option ${x===p?'selected':''}>${e(x)}</option>`).join('')}</select></div></div><div>${t||'<div class="empty">No memories match your search.</div>'}</div></section><section class="cta"><div><span class="eyebrow">✦ YOUR STORY IS STILL BEING WRITTEN</span><h2>Make room for<br><em>what comes next.</em></h2></div><button class="primary" id="ca">＋ Add a memory</button></section>`;['add','qa','ca'].forEach(id=>document.getElementById(id).onclick=files);['connect','qg'].forEach(id=>document.getElementById(id).onclick=google);document.querySelectorAll('.memory').forEach(x=>x.onclick=()=>detail(x.dataset.id));document.getElementById('search').oninput=x=>{q=x.target.value;render()};document.getElementById('place').onchange=x=>{p=x.target.value;render()};document.getElementById('qr').onclick=replay;document.getElementById('replay').onclick=replay;document.getElementById('timeline').onclick=render;document.getElementById('home').onclick=()=>{q='';p='all';render()}}function files(){let i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=()=>[...i.files].forEach((f,n)=>{if(!f.type.startsWith('image/'))return;let r=new FileReader;r.onload=()=>{m.unshift({id:'local'+Date.now()+n,date:new Date(f.lastModified||Date.now()).toISOString().slice(0,10),title:f.name.replace(/\.[^.]+$/,''),caption:'Captured and kept.',place:'My memories',src:r.result});save();render();toast('Memory added ✦')};r.readAsDataURL(f)});i.click()}function modal(s){let x=document.createElement('div');x.className='modal';x.innerHTML=`<div class="box">${s}</div>`;document.body.append(x);x.onclick=z=>{if(z.target===x)x.remove()};return x}function detail(id){let x=m.find(a=>a.id===id);if(!x)return;let z=modal(`<button class="close">×</button><img src="${e(x.src)}" style="width:100%;max-height:400px;object-fit:cover;border-radius:14px"><p>${e(x.date)} · ${e(x.place)}</p><h2>${e(x.title)}</h2><p>${e(x.caption)}</p><button class="ghost full" id="remove">Remove memory</button>`);z.querySelector('.close').onclick=()=>z.remove();z.querySelector('#remove').onclick=()=>{m=m.filter(a=>a.id!==id);save();z.remove();render()}}function google(){let z=modal(`<button class="close">×</button><span class="eyebrow">GOOGLE PHOTOS</span><h2>Bring your memories with you.</h2><p>Connect your Google Photos account with read-only access. Add your Web OAuth Client ID to continue.</p><input id="cid" placeholder="OAuth Web Client ID"><button class="primary full" id="start">Connect & choose photos</button><button class="ghost full" id="skip">Continue without Google Photos</button>`);z.querySelector('.close').onclick=()=>z.remove();z.querySelector('#skip').onclick=()=>z.remove();z.querySelector('#start').onclick=()=>toast('OAuth setup is ready — configure your Google Cloud client first')}function replay(){let a=[...m].sort((x,y)=>y.date.localeCompare(x.date));app.innerHTML=`<section class="story"><button class="ghost" id="back">← Timeline</button><h1>The moments<br><em>that made your story.</em></h1><p>${m.length} memories · ${new Set(m.map(x=>x.place)).size} places</p><div class="grid">${a.map(x=>`<article class="storyCard"><img src="${e(x.src)}"><div><small>${e(x.date)} · ${e(x.place)}</small><h3>${e(x.title)}</h3><p>${e(x.caption)}</p></div></article>`).join('')}</div></section>`;document.getElementById('back').onclick=render}render()})()</script></body></html>
