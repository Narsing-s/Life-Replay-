<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090d"><title>Life Replay — Your life, beautifully remembered</title><script src="https://accounts.google.com/gsi/client" async defer></script><style>*{box-sizing:border-box}html,body{margin:0;background:#08080c;color:#f8f5ef;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.top{height:72px;border-bottom:1px solid #ffffff18;display:flex;align-items:center;position:sticky;top:0;background:#08080de8;backdrop-filter:blur(20px);z-index:20}.top .wrap{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:2px}.brand i{color:#d8b8ff;font-style:normal}.nav{display:flex;gap:8px}.btn{border:1px solid #ffffff20;background:#ffffff0b;color:#fff;border-radius:12px;padding:11px 15px;cursor:pointer}.btn:hover{background:#ffffff16}.primary{background:#f3eee7;color:#111;border:0;font-weight:800}.hero{padding:68px 0 35px;display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:center}.eyebrow{font-size:10px;letter-spacing:2px;color:#a69fac;font-weight:800}.hero h1{font:800 clamp(50px,7vw,86px)/.9 system-ui;margin:18px 0}.hero em,.viewer h1 em{font:400 1em Georgia,serif;color:#dcc7ea}.hero p{font-size:18px;line-height:1.7;color:#aaa3ae}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.heroimg{height:470px;border-radius:28px;overflow:hidden;border:1px solid #ffffff20;position:relative}.heroimg img{width:100%;height:100%;object-fit:cover}.caption{position:absolute;bottom:16px;left:16px;right:16px;padding:17px;border:1px solid #ffffff22;border-radius:16px;background:#09090dd9}.caption b{display:block;font:400 27px Georgia,serif;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#ffffff18;border-radius:18px;overflow:hidden}.stat{background:#ffffff08;text-align:center;padding:23px}.stat b{display:block;font-size:30px}.stat span{font-size:10px;letter-spacing:1.5px;color:#89828e;text-transform:uppercase}.floating{position:relative;height:150px;margin:22px 0 12px;overflow:hidden}.bubble{position:absolute;width:86px;height:86px;border-radius:50%;overflow:hidden;border:2px solid #ffffff55;box-shadow:0 15px 40px #0008;animation:float 5s ease-in-out infinite}.bubble img{width:100%;height:100%;object-fit:cover}.bubble:nth-child(1){left:5%;top:22px}.bubble:nth-child(2){left:22%;top:4px;animation-delay:.7s}.bubble:nth-child(3){left:41%;top:30px;animation-delay:1.2s}.bubble:nth-child(4){left:60%;top:0;animation-delay:1.8s}.bubble:nth-child(5){left:78%;top:35px;animation-delay:.4s}@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-17px) rotate(3deg)}}.section{padding:58px 0}.head{display:flex;justify-content:space-between;align-items:end;gap:15px}.head h2{font:400 42px Georgia,serif;margin:8px 0}.input{background:#ffffff09;color:#eee;border:1px solid #ffffff20;border-radius:11px;padding:11px 13px}.year{margin-top:38px}.year h3{font:400 30px Georgia,serif;margin:0 0 14px}.month{color:#918a95;font-size:12px;text-transform:uppercase;letter-spacing:1.5px;margin:22px 0 8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#15131a;border:1px solid #ffffff13;border-radius:18px;overflow:hidden;cursor:pointer;transition:.25s;animation:rise .5s both}.card:hover{transform:translateY(-5px);border-color:#ffffff30}.card img{width:100%;height:230px;object-fit:cover;display:block}.cardbody{padding:16px}.cardbody b{font:400 24px Georgia,serif}.cardbody p{color:#99929e;margin:8px 0;line-height:1.45}.cardbody small{color:#77707d}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:35px}.quick .btn{text-align:left;padding:19px}.quick b{display:block}.quick small{color:#88818e}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:18px;z-index:50}.box{width:min(500px,100%);max-height:90vh;overflow:auto;background:#17151e;border:1px solid #ffffff20;border-radius:22px;padding:28px;box-shadow:0 30px 100px #000}.box h2{font:400 34px Georgia,serif;margin:10px 0 18px}.box p{color:#aaa3ae;line-height:1.6}.close{float:right;border:0;background:#ffffff10;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer}.field{width:100%;padding:13px 14px;margin:7px 0;background:#0c0b10;color:#fff;border:1px solid #ffffff18;border-radius:12px}.formrow{display:grid;gap:6px;margin:12px 0}.tabs{display:flex;gap:6px;margin-bottom:18px}.tabs .active{background:#f3eee7;color:#111}.photosgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.photosgrid img{width:100%;height:125px;object-fit:cover;border-radius:10px;cursor:pointer}.viewer{position:fixed;inset:0;background:#050507f5;z-index:80;display:grid;grid-template-rows:auto 1fr auto}.viewerbar{padding:18px;display:flex;justify-content:space-between}.viewerstage{display:grid;place-items:center;padding:10px}.viewerstage img{max-width:90vw;max-height:70vh;object-fit:contain;border-radius:16px;box-shadow:0 25px 90px #000}.viewerfooter{padding:20px;display:flex;justify-content:center;gap:10px}.counter{position:absolute;top:82px;left:50%;transform:translateX(-50%);color:#aaa;font-size:12px}.empty{text-align:center;color:#888;padding:55px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f3eee7;color:#111;padding:12px 16px;border-radius:12px;z-index:100}@media(max-width:800px){.nav{display:none}.hero{grid-template-columns:1fr;padding:45px 0 20px}.heroimg{height:360px}.grid{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr}.head{display:block}.head .input{margin-top:14px;width:100%}.card img{height:190px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.floating{height:125px}.bubble{width:66px;height:66px}.photosgrid{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><div class="wrap"><div class="brand"><i>✦</i> LIFE REPLAY</div><nav class="nav"><button class="btn" id="timeline">Timeline</button><button class="btn" id="replay">Replay</button><button class="btn" id="account">Sign in</button></nav></div></header><div id="app"></div><script>(function(){'use strict';const API=location.origin;const PHOTOS_CLIENT_ID=localStorage.getItem('lifeReplayGoogleClientId')||'';const demo=[{id:'d1',date:'2026-03-21',title:'Out there',caption:'A day that felt different.',place:'Travel',mediaUrl:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1400&q=85'},{id:'d2',date:'2026-02-14',title:'Small moments',caption:'The moments worth keeping.',place:'City',mediaUrl:'https://images.unsplash.com/photo-1511988617509-a57c8a288659?auto=format&fit=crop&w=1400&q=85'},{id:'d3',date:'2025-12-25',title:'A warm memory',caption:'The moments worth keeping.',place:'Home',mediaUrl:'https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=1400&q=85'}];let memories=[],user=null,query='';try{user=JSON.parse(localStorage.getItem('lifeReplayUser')||'null')}catch(e){}const token=()=>localStorage.getItem('lifeReplayToken')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}async function load(){if(!token()){memories=demo;render();return}try{const r=await fetch(API+'/api/memories',{headers:{Authorization:'Bearer '+token()}});if(!r.ok)throw Error();memories=(await r.json()).memories||[];render()}catch(e){memories=demo;render();toast('API not reachable — showing local demo')}}async function auth(mode,email,password,name){const r=await fetch(API+'/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,name})});const d=await r.json();if(!r.ok)throw Error(d.error||'Authentication failed');localStorage.setItem('lifeReplayToken',d.token);localStorage.setItem('lifeReplayUser',JSON.stringify(d.user));user=d.user;closeModal();await load();toast('Welcome back, '+d.user.name+' ✦')}function modal(html){const x=document.createElement('div');x.className='modal';x.innerHTML='<div class="box">'+html+'</div>';document.body.appendChild(x);x.querySelector('.close')?.addEventListener('click',()=>x.remove());return x}function closeModal(){document.querySelector('.modal')?.remove()}function login(){const x=modal('<button class="close">×</button><div class="eyebrow">PRIVATE MEMORY SPACE</div><h2>Sign in to Life Replay</h2><p>Your email and password protect your personal timeline.</p><div class="tabs"><button class="btn active" id="li">Sign in</button><button class="btn" id="re">Create account</button></div><div id="form"></div>');const draw=(register)=>{x.querySelector('#form').innerHTML='<div class="formrow">'+(register?'<input class="field" id="name" placeholder="Your name">':'')+'<input class="field" id="email" type="email" placeholder="Email address" autocomplete="email"><input class="field" id="pass" type="password" placeholder="Password (8+ characters)" autocomplete="current-password"></div><button class="btn primary" id="go">'+(register?'Create account':'Sign in')+'</button><button class="btn" id="google" style="margin-left:6px">Connect Google Photos</button><p style="font-size:12px">Google Photos is connected after your Life Replay account is authenticated.</p>';x.querySelector('#go').onclick=async()=>{try{await auth(register?'register':'login',x.querySelector('#email').value,x.querySelector('#pass').value,register?x.querySelector('#name').value:undefined)}catch(e){toast(e.message)}};x.querySelector('#google').onclick=googlePhotos};x.querySelector('#li').onclick=()=>{x.querySelector('#li').classList.add('active');x.querySelector('#re').classList.remove('active');draw(false)};x.querySelector('#re').onclick=()=>{x.querySelector('#re').classList.add('active');x.querySelector('#li').classList.remove('active');draw(true)};draw(false)}function googlePhotos(){if(!user&&!token()){login();toast('Sign in first, then connect Google Photos');return}if(!PHOTOS_CLIENT_ID){const x=modal('<button class="close">×</button><div class="eyebrow">GOOGLE PHOTOS SETUP</div><h2>Connect your photo library</h2><p>Enter your Google OAuth Web Client ID once. It is stored only in this browser.</p><input class="field" id="cid" placeholder="123...apps.googleusercontent.com"><button class="btn primary" id="savecid">Save & connect</button><p style="font-size:12px">Use the web application OAuth client and add this site origin in Google Cloud.</p>');x.querySelector('#savecid').onclick=()=>{const v=x.querySelector('#cid').value.trim();if(!v)return toast('Client ID required');localStorage.setItem('lifeReplayGoogleClientId',v);x.remove();location.reload()};return}if(!window.google?.accounts?.oauth2){toast('Google sign-in is still loading');return}const client=google.accounts.oauth2.initTokenClient({client_id:PHOTOS_CLIENT_ID,scope:'https://www.googleapis.com/auth/photoslibrary.readonly',callback:async res=>{if(res.error)return toast('Google Photos authorization failed');await importPhotos(res.access_token)}});client.requestAccessToken()}async function importPhotos(accessToken){const x=modal('<button class="close">×</button><div class="eyebrow">GOOGLE PHOTOS</div><h2>Your memories</h2><p>Loading your Google Photos library…</p><div id="pg" class="photosgrid"></div>');try{const r=await fetch('https://photoslibrary.googleapis.com/v1/mediaItems:search',{method:'POST',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({pageSize:100,filters:{mediaTypeFilter:{mediaTypes:['PHOTO']}}})});const d=await r.json();if(!r.ok)throw Error(d.error?.message||'Google Photos request failed');const items=(d.mediaItems||[]).filter(m=>m.baseUrl);x.querySelector('p').textContent=items.length+' photos found — tap photos to add them to your timeline.';x.querySelector('#pg').innerHTML=items.map((m,i)=>'<img data-i="'+i+'" src="'+esc(m.baseUrl+'=w600-h600')+'" alt="Photo '+(i+1)+'">').join('');x.querySelectorAll('img').forEach(img=>img.onclick=()=>addGoogleMemory(items[+img.dataset.i],accessToken));}catch(e){x.querySelector('p').textContent=e.message}}async function addGoogleMemory(m,accessToken){if(!token()){toast('Sign in required');return}try{const blob=await (await fetch(m.baseUrl+'=w1600')).blob();const fd=new FormData();fd.append('image',blob,m.filename||'google-photo.jpg');fd.append('title',m.filename||'Google Photos memory');fd.append('caption','Imported from Google Photos');fd.append('place','Google Photos');fd.append('date',(m.mediaMetadata?.creationTime||new Date().toISOString()).slice(0,10));const r=await fetch(API+'/api/memories',{method:'POST',headers:{Authorization:'Bearer '+token()},body:fd});if(!r.ok)throw Error();toast('Memory imported ✦');await load()}catch(e){toast('Could not import this photo')}}function group(list){const out={};list.forEach(m=>{const y=(m.date||'0000').slice(0,4),mo=(m.date||'').slice(0,7);out[y]??={};out[y][mo]??=[];out[y][mo].push(m)});return out}function render(){const list=memories.filter(m=>!query||[m.title,m.caption,m.place,m.date].join(' ').toLowerCase().includes(query.toLowerCase()));const latest=list[0]||demo[0],g=group(list),years=Object.keys(g).sort((a,b)=>b-a),places=new Set(memories.map(m=>m.place)),bubbles=memories.slice(0,5).map(m=>'<div class="bubble"><img src="'+esc(m.mediaUrl)+'"></div>').join('');document.getElementById('app').innerHTML='<main class="wrap"><section class="hero"><div><div class="eyebrow">✦ YOUR PERSONAL MEMORY SPACE</div><h1>Your life,<br><em>beautifully remembered.</em></h1><p>Memories arranged by the years and months they happened — with your Google Photos ready to become part of the story.</p><div class="actions"><button class="btn primary" id="photos">◎ Connect Google Photos</button><button class="btn" id="replayBtn">▶ Replay</button></div></div><div class="heroimg"><img src="'+esc(latest.mediaUrl)+'"><div class="caption"><span class="eyebrow">LATEST MEMORY</span><b>'+esc(latest.title)+'</b><small>'+esc(latest.date)+' · '+esc(latest.place)+'</small></div></div></section><section class="stats"><div class="stat"><b>'+memories.length+'</b><span>Memories</span></div><div class="stat"><b>'+places.size+'</b><span>Places</span></div><div class="stat"><b>'+years.length+'</b><span>Years</span></div></section><section><div class="floating">'+bubbles+'</div></section><section class="quick"><button class="btn" id="openReplay"><b>▶ Open memory replay</b><small>Next photo, next moment</small></button><button class="btn" id="openPhotos"><b>◎ Bring Google Photos</b><small>Import your real memories</small></button><button class="btn" id="account2"><b>◉ '+(user?esc(user.name):'Sign in')+'</b><small>Email & password account</small></button></section><section class="section"><div class="head"><div><div class="eyebrow">MEMORY TIMELINE</div><h2>Moments by year & month</h2></div><input class="input" id="search" placeholder="Search memories…" value="'+esc(query)+'"></div>'+years.map(y=>'<div class="year"><h3>'+y+'</h3>'+Object.keys(g[y]).sort().reverse().map(mo=>'<div class="month">'+new Date(mo+'-01T00:00:00').toLocaleString(undefined,{month:'long'})+'</div><div class="grid">'+g[y][mo].map(m=>'<article class="card" data-id="'+esc(m.id)+'"><img src="'+esc(m.mediaUrl)+'"><div class="cardbody"><small>'+esc(m.date)+' · '+esc(m.place)+'</small><br><b>'+esc(m.title)+'</b><p>'+esc(m.caption)+'</p><button class="btn">Open →</button></div></article>').join('')+'</div>').join('')+'</div>').join('')+(years.length?'':'<div class="empty">No memories yet. Connect Google Photos or add your first memory.</div>')+'</section></main>';document.getElementById('photos').onclick=googlePhotos;document.getElementById('openPhotos').onclick=googlePhotos;document.getElementById('account').onclick=login;document.getElementById('account2').onclick=login;document.getElementById('timeline').onclick=()=>{query='';render()};document.getElementById('replayBtn').onclick=()=>viewer(0);document.getElementById('openReplay').onclick=()=>viewer(0);document.getElementById('search').oninput=e=>{query=e.target.value;render()};document.querySelectorAll('.card').forEach(c=>c.onclick=()=>viewer(memories.findIndex(m=>m.id===c.dataset.id)))}function viewer(start){const arr=memories.length?memories:demo;let i=Math.max(0,start||0);const x=document.createElement('div');x.className='viewer';x.innerHTML='<div class="viewerbar"><button class="btn" id="back">← Timeline</button><button class="btn" id="close">×</button></div><div class="counter" id="count"></div><div class="viewerstage"><div><img id="vimg"><div style="text-align:center;margin-top:15px"><div class="eyebrow" id="vdate"></div><h1 style="font:400 40px Georgia,serif;margin:7px" id="vtitle"></h1><p style="color:#999" id="vcaption"></p></div></div></div><div class="viewerfooter"><button class="btn" id="prev">← Previous</button><button class="btn primary" id="next">Next photo →</button></div>';document.body.appendChild(x);function draw(){const m=arr[i];x.querySelector('#vimg').src=m.mediaUrl;x.querySelector('#vdate').textContent=m.date+' · '+m.place;x.querySelector('#vtitle').textContent=m.title;x.querySelector('#vcaption').textContent=m.caption;x.querySelector('#count').textContent=(i+1)+' / '+arr.length;x.querySelector('#vimg').animate([{opacity:.2,transform:'scale(.97)'},{opacity:1,transform:'scale(1)'}],{duration:420,easing:'ease-out'})}x.querySelector('#next').onclick=()=>{i=(i+1)%arr.length;draw()};x.querySelector('#prev').onclick=()=>{i=(i-1+arr.length)%arr.length;draw()};x.querySelector('#close').onclick=()=>x.remove();x.querySelector('#back').onclick=()=>x.remove();x.onkeydown=e=>{if(e.key==='ArrowRight')x.querySelector('#next').click();if(e.key==='ArrowLeft')x.querySelector('#prev').click();if(e.key==='Escape')x.remove()};draw()}window.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement?.id==='email'){} });load()})();</script></body></html>
